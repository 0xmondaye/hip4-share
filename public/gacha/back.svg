<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1275" width="760" height="1275">
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3d42"/>
      <stop offset="0.5" stop-color="#26282c"/>
      <stop offset="1" stop-color="#33363b"/>
    </linearGradient>
    <linearGradient id="slabEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5e66"/>
      <stop offset="1" stop-color="#1c1e21"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f2"/>
      <stop offset="1" stop-color="#d8d8d4"/>
    </linearGradient>
    <radialGradient id="cardback" cx="0.5" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#20301a"/>
      <stop offset="0.55" stop-color="#141a12"/>
      <stop offset="1" stop-color="#0b0d0a"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- slab shell -->
  <rect x="14" y="14" width="732" height="1247" rx="46" fill="url(#slabEdge)"/>
  <rect x="22" y="22" width="716" height="1231" rx="40" fill="url(#slab)"/>
  <rect x="40" y="40" width="680" height="1195" rx="30" fill="none" stroke="#0f1012" stroke-width="4"/>

  <!-- label -->
  <rect x="58" y="58" width="644" height="180" rx="18" fill="url(#label)"/>
  <rect x="58" y="58" width="644" height="180" rx="18" fill="none" stroke="#b9b9b4" stroke-width="3"/>
  <text x="92" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="6" fill="#1d1f23">GRADED</text>
  <text x="92" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="500" font-size="30" letter-spacing="3" fill="#6b6e75">AUTHENTIC &#183; SEALED</text>
  <!-- grade box -->
  <rect x="536" y="82" width="132" height="132" rx="14" fill="#1d1f23"/>
  <text x="602" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="84" fill="#a3e635" text-anchor="middle">?</text>
  <!-- barcode -->
  <g fill="#2a2c30">
    <rect x="94" y="206" width="5" height="18"/><rect x="104" y="206" width="3" height="18"/><rect x="112" y="206" width="7" height="18"/><rect x="124" y="206" width="3" height="18"/><rect x="132" y="206" width="5" height="18"/><rect x="142" y="206" width="9" height="18"/><rect x="156" y="206" width="3" height="18"/><rect x="164" y="206" width="5" height="18"/><rect x="174" y="206" width="3" height="18"/><rect x="182" y="206" width="7" height="18"/><rect x="194" y="206" width="4" height="18"/><rect x="203" y="206" width="8" height="18"/><rect x="216" y="206" width="3" height="18"/><rect x="224" y="206" width="5" height="18"/><rect x="234" y="206" width="3" height="18"/><rect x="242" y="206" width="6" height="18"/>
  </g>

  <!-- card window -->
  <rect x="96" y="286" width="568" height="884" rx="22" fill="#050605"/>
  <rect x="106" y="296" width="548" height="864" rx="16" fill="url(#cardback)"/>
  <rect x="106" y="296" width="548" height="864" rx="16" fill="none" stroke="#a3e635" stroke-opacity="0.35" stroke-width="3"/>

  <!-- card back mark -->
  <circle cx="380" cy="712" r="240" fill="url(#halo)"/>
  <circle cx="380" cy="712" r="150" fill="none" stroke="#a3e635" stroke-opacity="0.55" stroke-width="5"/>
  <circle cx="380" cy="712" r="120" fill="none" stroke="#a3e635" stroke-opacity="0.25" stroke-width="2"/>
  <text x="380" y="790" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="220" fill="#a3e635" text-anchor="middle">?</text>

  <!-- corner ticks on card back -->
  <g stroke="#a3e635" stroke-opacity="0.4" stroke-width="4" fill="none">
    <path d="M150 356 h44 M150 356 v44"/>
    <path d="M610 356 h-44 M610 356 v44"/>
    <path d="M150 1116 h44 M150 1116 v-44"/>
    <path d="M610 1116 h-44 M610 1116 v-44"/>
  </g>

  <!-- acrylic sheen -->
  <rect x="22" y="22" width="716" height="1231" rx="40" fill="url(#sheen)"/>
</svg>
