<svg xmlns="http://www.w3.org/2000/svg" width="320" height="427" viewBox="0 0 320 427" fill="none">
  <!-- Stand-in foil pack for the PackTear theater. cac feeds PackTear a static local
       render too (PACK_BY_KIND), so local art is the faithful shape of the port — the
       Slabz API returns imageUrl:null in prod, there is no per-pack render to tear.

       Composition is tied to PackTear's constants: the rip line sits at STRIP_RATIO
       (22% => y=94), so everything above y=94 is the crimp strip that tears away and
       nothing readable may cross it. ponytail: swap in real Gambit art and re-check
       that one line; the natural aspect is read off the image, so only this matters. -->
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2430"/>
      <stop offset=".45" stop-color="#11151b"/>
      <stop offset="1" stop-color="#1e2618"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0"/>
      <stop offset=".4" stop-color="#a3e635" stop-opacity=".12"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset=".68" stop-color="#a3e635" stop-opacity=".06"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crimp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3440"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".55">
      <stop offset="0" stop-color="#a3e635" stop-opacity=".16"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- body -->
  <rect x="6" y="4" width="308" height="419" rx="10" fill="url(#foil)"/>
  <rect x="6" y="4" width="308" height="419" rx="10" fill="url(#glow)"/>
  <rect x="6" y="4" width="308" height="419" rx="10" fill="url(#sheen)"/>

  <!-- crimp strip: everything above the y=94 rip line tears away. Kept text-free. -->
  <rect x="6" y="4" width="308" height="90" rx="10" fill="url(#crimp)"/>
  <g fill="#0d1116" opacity=".5">
    <path d="M14 58l9 9-9 9zM38 58l9 9-9 9zM62 58l9 9-9 9zM86 58l9 9-9 9zM110 58l9 9-9 9zM134 58l9 9-9 9zM158 58l9 9-9 9zM182 58l9 9-9 9zM206 58l9 9-9 9zM230 58l9 9-9 9zM254 58l9 9-9 9zM278 58l9 9-9 9z"/>
  </g>
  <path d="M6 94h308" stroke="#a3e635" stroke-opacity=".14"/>

  <!-- wordmark, clear of the rip line -->
  <text x="160" y="136" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="19" letter-spacing="7" fill="#e8f6d5" fill-opacity=".82">GAMBIT</text>
  <text x="160" y="157" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="9" letter-spacing="4.5" fill="#a3e635" fill-opacity=".7">GRADED SLABS</text>

  <!-- face -->
  <rect x="34" y="184" width="252" height="186" rx="8" fill="#0b0e12" fill-opacity=".5" stroke="#a3e635" stroke-opacity=".2"/>
  <g stroke="#a3e635" stroke-opacity=".45" stroke-width="2" fill="none">
    <path d="M46 208v-12h12M274 208v-12h-12M46 346v12h12M274 346v12h-12"/>
  </g>
  <text x="160" y="298" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="58" letter-spacing="2" fill="#a3e635" fill-opacity=".24">?</text>
  <text x="160" y="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="10" letter-spacing="4" fill="#e8f6d5" fill-opacity=".35">MYSTERY PACK</text>
</svg>
